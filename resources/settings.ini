; Demon's Souls PC - ajustes. Se cambian en el lanzador (se abre al ejecutar Demon's Souls.exe). En el juego F1 guarda y sale.
; 1 = si, 0 = no. Lo que no se reconoce se ignora; borrar este archivo vuelve a los valores por defecto.

[Juego]
; Carpeta del juego volcado (la que tiene eboot.bin y sce_sys), o un .zar. Vacia: se pregunta al arrancar.
carpeta_juego=
; Idioma de la consola: 3 espanol (Espana), 20 espanol (Latinoamerica), 1 ingles (EE. UU.), 18 ingles (R. U.)
idioma_juego=
; Copia de seguridad de _SaveData en _SaveData-copias antes de jugar
copia_partidas=1
; En el juego F1 (o R3 + OPTIONS) guarda y cierra; 1: JUGAR pasa solo el titulo y continua donde se pulso F1
continuar_f1=1

[Pantalla]
pantalla_completa=1
; Tamano de la ventana (sin pantalla completa)
ancho=2560
alto=1440
; HDR10: solo si "Usar HDR" esta activado en la configuracion de pantalla de Windows
hdr=0
vsync=0
; G-Sync / FreeSync: el reloj del emulador no se ata a los Hz del monitor
gsync=0
; Experimental: el juego pasa de 60 FPS reales (videos y menus siguen a 60)
fps_desbloqueados=0
; Tope de FPS con G-Sync y FPS desbloqueados sin frame generation (0 = automatico, justo bajo el refresco)
tope_fps=0
; Mantener 16:9 con bandas negras en vez de estirar
ajustar_aspecto=0
; Aspecto del 3D: 16:9, 21:9 o 32:9 (ultrapanoramico)
aspecto=16:9

[Reescalado]
; nativo, dlss-dlaa, dlss-ucalidad, dlss-calidad, dlss-equilibrado, dlss-rendimiento,
; xess-aa, xess-ucalidad-plus, xess-ucalidad, xess-calidad, xess-equilibrado, xess-rendimiento,
; fsr-aa, fsr-ucalidad, fsr-calidad, fsr-equilibrado, fsr-rendimiento
reescalado=nativo
; auto, 0, 0.25, 0.5, 0.75, 1
nitidez=auto
; auto, K (DLSS 4), L o M (DLSS 4.5)
preset_dlss=auto

[FrameGeneration]
; sin-fg, amd-x2, amd-x3, amd-x4, amd-120, amd-dinamico,
; dlss-x2, dlss-x3, dlss-x4, dlss-x5, dlss-x6, dlss-120, dlss-dinamico (NVIDIA RTX)
frame_generation=sin-fg

[Rendimiento]
; Optimizacion equipos 16 GB RAM: el perfil de memoria de 16 GB (6 GB fijos en RAM, la precarga espera con
; menos de 1,5 GB libres). Solo se aplica en PCs de 20 GB de RAM o menos, o con simular_ram_16gb. No cambia los graficos.
perfil_16gb=0
; Para graficas que se cuelgan o dan pantallazo azul (~37% menos FPS)
gpu_seguro=0
; Pruebas: el juego como en un PC de 16 GB de RAM / con una grafica de 8 GB
simular_ram_16gb=0
simular_vram_8gb=0
; Ryzen con dos CCD: 0 = el juego en el CCD con mas cache L3 (mas rapido); 1 = todos los nucleos
todos_los_ccd=0
; Anti-Lag con la frame generation de AMD: auto (Anti-Lag 2 en graficas AMD, el nuestro en las demas), amd2, normal,
; ultra, no. En los modos Souls ligero, equilibrado y low profile va siempre el nuestro en Ultra.
antilag_modo=auto
; Con la frame generation de NVIDIA: reflex (recomendado), normal o ultra (el nuestro, con Reflex apagado)
antilag_dlssg=reflex

[Graficos]
; Modos Souls: ninguno; low (PC low profile: 900p con FSR, todo en bajo, 30 reales x2 AMD); ligero (graficas de 8 GB: 30 reales x2 AMD, FSR Calidad, texturas y sombras medio);
; equilibrado (45 reales x2 AMD, texturas, distancia y sombras alto); ultra (RTX 5060-5070 Ti, RX 9070);
; extremo (RTX 5080 / 5090: todo al maximo). Los FPS dependen de tu GPU y tu CPU.
; Ligero, equilibrado y low mandan sobre frame_generation (AMD x2 fija; el reescalado DLSS si se puede usar).
modo_souls=ninguno
; Optimizacion tarjetas 8 GB: en el menu pone texturas en bajo y distancia y sombras en medio
optimizacion_8gb=0
; Texturas: 0 (Maximo), h (Alto), 1 (Medio, mitad), 2 (Bajo, un cuarto)
reducir_texturas=0
; Distancia de dibujado: standard (Maximo, el juego tal cual), high (Alto), low (Medio), lowest (Bajo)
calidad=standard
; Sombras: maximo (las del juego), alto (sol hasta 190 m), medio (125 m), bajo (60 m, sin focos ni ambientales)
sombras=maximo
; Detalle del juego: ultra, muy-alto (cine), alto (rendimiento de PS5), normal, bajo (teselado, cascadas, luz)
detalle=alto
; Reflejos del juego (SSR): ultra, alto (PS5), normal, bajo
reflejos=alto
; Distancia de los objetos (fundido a lo lejos): ultra, alto (PS5), normal, bajo
distancia_objetos=alto
; Nitidez del antialiasing del juego: ultra, alto, normal (PS5), bajo, no
nitidez_aa=normal
; Bordes sombras (filtrado de las sombras del juego): 0 normal, 1 alta, 2 muy alta, 3 ultra
bordes_sombras=0
; Sombra rincones (fuerza de la oclusion de ray tracing; necesita rt_oclusion=1): 0 normal, 1 alta, 2 maxima
sombra_rincones=0
; Postprocesado del juego (1 = como en PS5, 0 = quitado)
desenfoque_movimiento=1
profundidad_campo=1
vineteado=1
resplandor=1
adaptacion_ojo=1
; Filtrado anisotropico x16 (solo superficies de la escena)
filtrado_x16=0
; Texturas: 0 normales, 1 nitidas (con reescalado, el detalle de la resolucion final), 2 extra nitidas
texturas_nitidas=1

[RayTracing]
; Efectos de pantalla (sin RT por hardware; solo con DLSS, XeSS o FSR):
; Reflejos RT: 0 no, 1 bajo, 2 medio, 3 alto, 4 ultra, 5 extremo
reflejos_rt=0
; Luz RT (luz rebotada en pantalla): 0 no, 1 media, 2 alta, 3 ultra, 4 extremo
luz_rt_pantalla=0
; Sombras RT (sombras del sol de pantalla): 0 no, 1 bajo, 2 medio, 3 alto
sombras_rt=0
; Path tracing (oclusion y luz indirecta por RT por hardware; sin RT por hardware, oclusion de pantalla): 0 no, 1 bajo, 2 medio, 3 alto
oclusion_ao=0
; Humo y particulas: 0 no, 1 suave (sin cortes duros), 2 antorchas (ademas el humo brilla con la luz de las antorchas)
humo_particulas=2
; Luz de antorchas RT: 0 no, 1 bajo, 2 medio, 3 alto, 4 hibrido (alto + rayos por hardware; GPU con RT)
luz_antorchas=0
; Destellos de lente de antorchas y fuegos: 1 si, 0 no
destellos_lente=0
; RT por hardware (experimental): 1 activa las filas de trazado de rayos por hardware de abajo
rt_experimental=0
; Trazado de rayos por hardware (1 si, 0 no; solo con rt_experimental=1). Elegir un modo Souls los pone todos en 0.
rt_reflejos=0
rt_sombras_sol=0
rt_niebla=0
rt_particulas=0
rt_metal=0
rt_oclusion=0
; Luz volumetrica: 0 no, 1 bajo, 2 medio, 3 alto (excluye rt_sombras_sol)
luz_volumetrica=0
; Juego original: 1 apaga todos los efectos visuales que anade el emulador
juego_original=0

[Mandos]
; Teclado y raton (F7 tambien cambia el raton a mando en vivo)
teclado_raton=0
raton_sensibilidad=1
raton_antizona=0.15
; Teclas: Cross=F;R1=Mouse:Left;... (vacio = las de serie, estilo Souls)
mapa_teclado=
; Mando remapeado: a=Cross;b=Circle;... (boton fisico de SDL = control de PS5; vacio = normal)
mapa_mando=

[Interfaz]
; Metricas en pantalla: 0 no, 1 FPS, 2 FPS + detalle
metricas=0
; Idioma de los menus: es, en, pt, fr, it, de (vacio: el de Windows)
idioma_interfaz=
; (Ya no se usa: el lanzador se abre siempre; "Demon's Souls.exe" --sin-lanzador lo salta una vez)
menu_inicio=1
; Vibracion del mando (el audio haptico del DualSense como vibracion; mandos Xbox, DualSense por Bluetooth)
vibracion=1
vibracion_fuerza=4

[Avanzado]
; Interruptores del emulador: KYTY_X=1;KYTY_Y=2 (KYTY_X= lo quita). Solo para pruebas.
extra=
