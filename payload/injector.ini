; Injector settings (also changed live from the F1 menu, saved when the menu closes).
[injector]
fg=1
; shown-frame cap for VRR: -1 auto (refresh - refresh^2/3600: 240 Hz -> 224), 0 off, or fps
fg_cap_fps=-1
osd=1
analyze=1
use_game_inputs=1
min_confidence_pct=60
mv_sign=-1
mv_units=0
; 0 auto (from the depth clear value), 1 normal, 2 reversed
depth_mode=0
previews=1
