; Injector settings (also changed live from the menu, saved when the menu closes).
[injector]
; keys: a name (F1..F12, Insert, Home, End, Delete, PageUp, PageDown, Pause, ScrollLock) or a virtual-key number
menu_key=F2
fg_key=F3
fg=1
; shown-frame cap for VRR: -1 auto (refresh - refresh^2/3600: 240 Hz -> 224), 0 off, or fps
fg_cap_fps=-1
osd=1
analyze=1
use_game_inputs=1
min_confidence_pct=60
mv_sign=-1
mv_units=0
; 0 auto (from the depth clear value), 1 normal, 2 reversed
depth_mode=0
previews=1
; ---- upscaling (menu > Reescalado) ----
; the upscaler's A/B toggle (the game's original image on screen)
ab_key=F4
; 0 off, 1 DLSS (Streamline), 2 FSR 4, 3 FSR 3.1, 4 XeSS. Lower the game's own resolution scale (e.g. 67%) first.
upscaler=0
; 0 auto (from the game's scale), 1 native AA, 2 quality, 3 balanced, 4 performance, 5 ultra performance
up_quality=0
; RCAS at the display size, 0-100
up_sharpness_pct=30
up_split=0
; 0 auto (detected in the projection), 1 none, 2 inject a Halton jitter (the game's TAA off)
up_jitter=0
; 0 the scene image after the game's TAA, 1 pre-TAA (experimental)
up_input=0
; also when the game renders at the display size (anti-aliasing only)
up_native=0
; load NVIDIA Streamline at start (DLSS); 0 if it causes trouble
up_streamline=1
