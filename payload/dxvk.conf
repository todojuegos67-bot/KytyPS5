# Installed by the injector next to the game's exe (DXVK reads dxvk.conf from the working directory / exe folder).
# One frame queued between the game and DXVK's present thread: with frame generation the real frames are held at
# present to stay under the VRR cap, and this keeps the game from queueing more frames behind it (lower latency).
dxgi.maxFrameLatency = 1
d3d9.maxFrameLatency = 1
