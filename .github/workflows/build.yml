name: Build KytyPS5 (Windows)

# Marvel's Wolverine TURBO (this branch): the Wolverine fork (wolverine-perf) with the Demon's Souls
# fork's generic FSR 3 frame generation. A manual run (Actions > Build KytyPS5 (Windows) > Run workflow) builds the
# package and uploads it as a DRAFT release (never public, never the latest, unless publish=true is given by hand).
on:
  workflow_dispatch:
    inputs:
      pgo_generate:
        description: 'Unused on this branch (kept for the shared dispatch command)'
        type: boolean
        default: false
      ffx_mfg:
        description: 'Also build amd_fidelityfx_vk.dll from the patched SDK (FSR 3 x3/x4, packaged in fsr3-mfg\)'
        type: boolean
        default: false
      publish:
        description: 'Publish the release (not a draft) and mark it as the latest'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  KYTY_BUILD_ORIGIN: Fork
  KYTY_BUILD_REPOSITORY: ${{ github.repository }}

jobs:
  windows:
    name: Build (Windows x64)
    runs-on: windows-2022
    outputs:
      package: ${{ steps.name.outputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Package name
        id: name
        shell: pwsh
        run: |
          $name = "KytyPS5-Wolverine-TURBO-$((Get-Date).ToUniversalTime().ToString('yyyyMMdd'))-$($env:GITHUB_SHA.Substring(0, 8))"
          if ($env:GITHUB_REF_NAME -in @('rtall-1023','wolverine-turbo6-1025','wolverine-turbo5-1025','wolverine-turbo4-1025','wolverine-turbo3-1025','wolverine-turbo2-1025','wolverine-turbo-1025')) { $name = "$name-fg" }
          "package=$name" >> $env:GITHUB_OUTPUT

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $root = Split-Path (Get-Command vcpkg).Source
          $hash = (Get-FileHash "$root\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          "root=$root" >> $env:GITHUB_OUTPUT
          "port_hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache glslang
        id: glslang
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          if ('${{ steps.glslang.outputs.cache-hit }}' -ne 'true') { vcpkg install 'glslang[tools,opt]:x64-windows' }
          "${{ steps.vcpkg.outputs.root }}\installed\x64-windows\tools\glslang" >> $env:GITHUB_PATH

      # AMD FidelityFX API, FSR 3.1.4 frame generation (src/graphics/presentation/window/fsr3FrameGen.cpp,
      # KYTY_FSR3_FG): AMD's prebuilt, signed amd_fidelityfx_vk.dll (MIT license), x2.
      - name: FidelityFX DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _Build\deps\ffx | Out-Null
          $base = 'https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/v1.1.4'
          Invoke-WebRequest "$base/PrebuiltSignedDLL/amd_fidelityfx_vk.dll" -OutFile _Build\deps\ffx\amd_fidelityfx_vk.dll
          Invoke-WebRequest "$base/LICENSE.txt" -OutFile _Build\deps\ffx\FidelityFX-LICENSE.txt
          Get-ChildItem _Build\deps\ffx | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.Name }

      # x3/x4 (KYTY_FSR3_MFG=3|4 with KYTY_FSR3_DLL=fsr3-mfg\amd_fidelityfx_vk.dll): the same SDK tag built from
      # source with tools/local/fsr3-mfg/ffx-sdk-v1.1.4-mfg.patch. Unsigned; packaged beside AMD's, not over it.
      - name: FidelityFX DLL (patched, multi frame generation)
        if: ${{ inputs.ffx_mfg == true || github.ref_name == 'rtall-1023' || github.ref_name == 'wolverine-turbo6-1025' || github.ref_name == 'wolverine-turbo5-1025' || github.ref_name == 'wolverine-turbo4-1025' || github.ref_name == 'wolverine-turbo3-1025' || github.ref_name == 'wolverine-turbo2-1025' || github.ref_name == 'wolverine-turbo-1025' }}
        shell: pwsh
        env:
          VULKAN_VERSION: 1.3.296.0
        run: |
          $vk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanSDK-$env:VULKAN_VERSION-Installer.exe" -OutFile "$env:RUNNER_TEMP\vksdk.exe"
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\vksdk.exe" -ArgumentList '--root', $vk, '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          if (!(Test-Path "$vk\Lib\vulkan-1.lib")) { Get-ChildItem $vk -ErrorAction SilentlyContinue; throw 'Vulkan SDK install failed' }
          $env:VULKAN_SDK = $vk
          $src = "$env:RUNNER_TEMP\ffx"
          git -c core.autocrlf=false clone --depth 1 --branch v1.1.4 https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK $src
          if ($LASTEXITCODE) { throw 'SDK clone failed' }
          git -C $src apply --verbose "$env:GITHUB_WORKSPACE\tools\local\fsr3-mfg\ffx-sdk-v1.1.4-mfg.patch"
          if ($LASTEXITCODE) { throw 'SDK patch failed' }
          cmake -S "$src\ffx-api" -B "$src\ffx-api\build" -G 'Visual Studio 17 2022' -A x64 -DFFX_API_BACKEND=VK_X64 "-DVulkan_INCLUDE_DIR=$vk\Include" "-DVulkan_LIBRARY=$vk\Lib\vulkan-1.lib"
          if ($LASTEXITCODE) { throw 'SDK configure failed' }
          cmake --build "$src\ffx-api\build" --config Release --target amd_fidelityfx_vk --parallel 4 -- /p:CL_MPcount=4 /v:minimal
          if ($LASTEXITCODE) { throw 'SDK build failed' }
          New-Item -ItemType Directory -Force _Build\deps\ffx-mfg | Out-Null
          $dll = Get-ChildItem "$src\ffx-api" -Recurse -Filter amd_fidelityfx_vk.dll | Where-Object FullName -notmatch 'PrebuiltSignedDLL' | Select-Object -First 1
          if (!$dll) { throw 'amd_fidelityfx_vk.dll not built' }
          Copy-Item $dll.FullName _Build\deps\ffx-mfg\amd_fidelityfx_vk.dll
          Get-ChildItem _Build\deps\ffx-mfg | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.Name }

      # The emulator only (the Qt launcher is not part of this package). Same flags as the Wolverine fork's CI.
      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B _Build/windows -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -DKYTY_BUILD_LAUNCHER=OFF ^
            -DKYTY_BUILD_ORIGIN=%KYTY_BUILD_ORIGIN% ^
            -DKYTY_BUILD_REPOSITORY=%KYTY_BUILD_REPOSITORY% ^
            -DKYTY_RELEASE_TAG=${{ steps.name.outputs.package }} ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl > build.log 2>&1 || (type build.log & exit /b 1)
          type build.log

      - name: Build
        shell: cmd
        run: |
          cmake --build _Build/windows --target kyty_emulator --parallel > build.log 2>&1 || (type build.log & exit /b 1)
          cmake --build _Build/windows --target lru_cache_tests --parallel >> build.log 2>&1 || (type build.log & exit /b 1)
          type build.log

      - name: Unit tests
        if: ${{ inputs.pgo_generate != true || github.ref_name == 'rtall-1023' || github.ref_name == 'wolverine-turbo6-1025' || github.ref_name == 'wolverine-turbo5-1025' || github.ref_name == 'wolverine-turbo4-1025' || github.ref_name == 'wolverine-turbo3-1025' || github.ref_name == 'wolverine-turbo2-1025' || github.ref_name == 'wolverine-turbo-1025' }}
        shell: cmd
        run: |
          ctest --test-dir _Build/windows --output-on-failure -R "^(lru_cache)$"

      - name: Build errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Select-String -Path build.log -Pattern 'error' | Select-Object -First 10 | ForEach-Object {
              $line = $_.Line -replace '[\r\n]', ' '
              Write-Output "::error::$line"
            }
          }

      - name: Package
        shell: pwsh
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          cmake --install _Build/windows --prefix _Build/windows/install
          if ($LASTEXITCODE) { throw 'install failed' }
          $out = "_Build\package\$env:PACKAGE"
          $emu = "$out\emulator"
          New-Item -ItemType Directory -Force $emu | Out-Null
          Copy-Item _Build\windows\install\* $emu -Recurse
          Copy-Item _Build\deps\ffx\amd_fidelityfx_vk.dll $emu
          New-Item -ItemType Directory -Force "$emu\licenses" | Out-Null
          Copy-Item _Build\deps\ffx\FidelityFX-LICENSE.txt "$emu\licenses\FidelityFX-LICENSE.txt"
          if (Test-Path _Build\deps\ffx-mfg\amd_fidelityfx_vk.dll) {
            New-Item -ItemType Directory -Force "$emu\fsr3-mfg" | Out-Null
            Copy-Item _Build\deps\ffx-mfg\amd_fidelityfx_vk.dll "$emu\fsr3-mfg"
          }
          Copy-Item LICENSE "$emu\LICENSE.txt"
          Copy-Item "packaging\wolverine-turbo\Play Wolverine TURBO.bat", packaging\wolverine-turbo\LEEME-TURBO.txt $out
          # The VC++ runtime next to the exe (Microsoft's redistributable files): nothing to install.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-Item "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" | Where-Object { $_.Parent.Parent.Name -match '^\d+\.' } |
            Sort-Object { [version]$_.Parent.Parent.Name } | Select-Object -Last 1
          if ($crt) { Copy-Item "$($crt.FullName)\msvcp140*.dll", "$($crt.FullName)\vcruntime140*.dll" $emu }
          $root = (Resolve-Path $out).Path
          Get-ChildItem $out -Recurse -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring($root.Length + 1) }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.package }}
          path: _Build/package/
          if-no-files-found: error

  release:
    name: Publish release
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE: ${{ needs.windows.outputs.package }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.package }}
          path: package

      - name: Publish
        shell: bash
        run: |
          trap 'echo "::error::publish failed at line $LINENO: $BASH_COMMAND"' ERR
          command -v zip > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zip; }
          (cd package && zip -qr "../$PACKAGE.zip" "$PACKAGE")
          tag="$PACKAGE"
          notes="Windows x64 test build of ${GITHUB_SHA::8} (todojuegos67-bot fork, branch $GITHUB_REF_NAME) for Marvel's Wolverine (PPSA03671 01.001.005): the Wolverine fork with FSR 3 frame generation (optical flow only). Unzip it into a new folder and double-click Play Wolverine TURBO.bat; LEEME-TURBO.txt explains the rest. Untested on hardware."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$PACKAGE.zip" --clobber --repo "$GITHUB_REPOSITORY"
          else
            draft="--draft"  # (10-24) siempre borrador salvo publish=true
            latest="--latest=false"  # (10-24) solo la que autorice el usuario (publish=true) pasa a ser la ultima
            if [ "${{ inputs.publish }}" = "true" ]; then draft=""; latest="--latest"; fi
            gh release create "$tag" "$PACKAGE.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $draft \
              --title "$PACKAGE" --notes "$notes" $latest 2> gh-err.txt || { echo "::error::gh release create: $(tr '\n' ' ' < gh-err.txt)"; exit 1; }
          fi
