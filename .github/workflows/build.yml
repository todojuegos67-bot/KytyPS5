name: Build KytyPS5 (Windows)

# Marvel's Wolverine glitch fixes (branch wolverine-fix-1025): the Wolverine fork (wolverine-dev) with
# rendering/audio diagnostics. A manual run (Actions > Build KytyPS5 (Windows) > Run workflow) builds the
# package and uploads it as a DRAFT release (never public, never the latest, unless publish=true is given by hand).
on:
  workflow_dispatch:
    inputs:
      pgo_generate:
        description: 'Unused on this branch (kept for the shared dispatch command)'
        type: boolean
        default: false
      ffx_mfg:
        description: 'Also build amd_fidelityfx_vk.dll from the patched SDK (FSR 3 x3/x4, packaged in fsr3-mfg\)'
        type: boolean
        default: false
      publish:
        description: 'Publish the release (not a draft) and mark it as the latest'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  KYTY_BUILD_ORIGIN: Fork
  KYTY_BUILD_REPOSITORY: ${{ github.repository }}

jobs:
  windows:
    name: Build (Windows x64)
    runs-on: windows-2022
    outputs:
      package: ${{ steps.name.outputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Package name
        id: name
        shell: pwsh
        run: |
          $name = "KytyPS5-Wolverine-FIX-$((Get-Date).ToUniversalTime().ToString('yyyyMMdd'))-$($env:GITHUB_SHA.Substring(0, 8))"
          if ($env:GITHUB_REF_NAME -ne 'wolverine-fix-1025') { $name = "$name-$($env:GITHUB_REF_NAME)" }
          "package=$name" >> $env:GITHUB_OUTPUT

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $root = Split-Path (Get-Command vcpkg).Source
          $hash = (Get-FileHash "$root\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          "root=$root" >> $env:GITHUB_OUTPUT
          "port_hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache glslang
        id: glslang
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          if ('${{ steps.glslang.outputs.cache-hit }}' -ne 'true') { vcpkg install 'glslang[tools,opt]:x64-windows' }
          "${{ steps.vcpkg.outputs.root }}\installed\x64-windows\tools\glslang" >> $env:GITHUB_PATH

      # The emulator only (the Qt launcher is not part of this package). Same flags as the Wolverine fork's CI.
      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B _Build/windows -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -DKYTY_BUILD_LAUNCHER=OFF ^
            -DKYTY_BUILD_ORIGIN=%KYTY_BUILD_ORIGIN% ^
            -DKYTY_BUILD_REPOSITORY=%KYTY_BUILD_REPOSITORY% ^
            -DKYTY_RELEASE_TAG=${{ steps.name.outputs.package }} ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl > build.log 2>&1 || (type build.log & exit /b 1)
          type build.log

      - name: Build
        shell: cmd
        run: |
          cmake --build _Build/windows --target kyty_emulator --parallel > build.log 2>&1 || (type build.log & exit /b 1)
          cmake --build _Build/windows --target lru_cache_tests --parallel >> build.log 2>&1 || (type build.log & exit /b 1)
          type build.log

      - name: Unit tests
        shell: cmd
        run: |
          ctest --test-dir _Build/windows --output-on-failure -R "^(lru_cache)$"

      - name: Build errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Select-String -Path build.log -Pattern 'error' | Select-Object -First 10 | ForEach-Object {
              $line = $_.Line -replace '[\r\n]', ' '
              Write-Output "::error::$line"
            }
          }

      - name: Package
        shell: pwsh
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          cmake --install _Build/windows --prefix _Build/windows/install
          if ($LASTEXITCODE) { throw 'install failed' }
          $out = "_Build\package\$env:PACKAGE"
          $emu = "$out\emulator"
          New-Item -ItemType Directory -Force $emu | Out-Null
          Copy-Item _Build\windows\install\* $emu -Recurse
          Copy-Item LICENSE "$emu\LICENSE.txt"
          Copy-Item packaging\wolverine\package\emulator\Kyty.ini $emu
          Copy-Item "packaging\wolverine\package\Play Wolverine.bat", packaging\wolverine\package\README.md $out
          # The VC++ runtime next to the exe (Microsoft's redistributable files): nothing to install.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-Item "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" | Where-Object { $_.Parent.Parent.Name -match '^\d+\.' } |
            Sort-Object { [version]$_.Parent.Parent.Name } | Select-Object -Last 1
          if ($crt) { Copy-Item "$($crt.FullName)\msvcp140*.dll", "$($crt.FullName)\vcruntime140*.dll" $emu }
          $root = (Resolve-Path $out).Path
          Get-ChildItem $out -Recurse -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring($root.Length + 1) }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.package }}
          path: _Build/package/
          if-no-files-found: error

  release:
    name: Publish release
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE: ${{ needs.windows.outputs.package }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.package }}
          path: package

      - name: Publish
        shell: bash
        run: |
          trap 'echo "::error::publish failed at line $LINENO: $BASH_COMMAND"' ERR
          command -v zip > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zip; }
          (cd package && zip -qr "../$PACKAGE.zip" "$PACKAGE")
          tag="$PACKAGE"
          notes="Windows x64 test build of ${GITHUB_SHA::8} (todojuegos67-bot fork, branch $GITHUB_REF_NAME, wolverine-fix-1025 line) for Marvel's Wolverine (PPSA03671 01.001.005): wolverine-dev plus glitch diagnostics (moon fallback clamp, audio trace/mute, live skip-list mask). All new switches default off. Untested on hardware."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$PACKAGE.zip" --clobber --repo "$GITHUB_REPOSITORY"
          else
            draft="--draft"  # (10-24) siempre borrador salvo publish=true
            latest="--latest=false"  # (10-24) solo la que autorice el usuario (publish=true) pasa a ser la ultima
            if [ "${{ inputs.publish }}" = "true" ]; then draft=""; latest="--latest"; fi
            gh release create "$tag" "$PACKAGE.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $draft \
              --title "$PACKAGE" --notes "$notes" $latest 2> gh-err.txt || { echo "::error::gh release create: $(tr '\n' ' ' < gh-err.txt)"; exit 1; }
          fi
