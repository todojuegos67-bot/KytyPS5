name: Build KytyPS5 (Windows)

# This fork's Windows build (Demon's Souls, see README.md): a manual run (Actions > Build KytyPS5 (Windows) >
# Run workflow) or a pushed v* tag builds the release package and publishes it as a GitHub release, marked
# latest (README.md links to the latest one). Pushes build nothing.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build (Windows x64)
    runs-on: windows-2022
    outputs:
      package: ${{ steps.name.outputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Package name
        id: name
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "KytyPS5-$env:GITHUB_REF_NAME" } else {
            "KytyPS5-$((Get-Date).ToUniversalTime().ToString('yyyyMMdd'))-$($env:GITHUB_SHA.Substring(0, 8))" }
          "package=$name" >> $env:GITHUB_OUTPUT

      # The tested compiler (LLVM 23.1.2 crashed compiling agc.cpp; others are untested).
      - name: Install LLVM 19.1.7
        shell: pwsh
        run: choco upgrade llvm --version=19.1.7 --allow-downgrade --no-progress -y

      # glslangValidator: the runner has no Vulkan SDK.
      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $root = Split-Path (Get-Command vcpkg).Source
          $hash = (Get-FileHash "$root\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          "root=$root" >> $env:GITHUB_OUTPUT
          "port_hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache glslang
        id: glslang
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          if ('${{ steps.glslang.outputs.cache-hit }}' -ne 'true') { vcpkg install 'glslang[tools,opt]:x64-windows' }
          "${{ steps.vcpkg.outputs.root }}\installed\x64-windows\tools\glslang" >> $env:GITHUB_PATH

      # DLSS frame generation (src/local/frame-gen.cpp): NVIDIA Streamline's headers (MIT, LICENSES/Streamline-MIT.txt)
      # at build time; its runtime is the user's own (the launcher's "Streamline..." folder). Without them the build
      # has no frame generation.
      - name: Streamline headers
        shell: pwsh
        continue-on-error: true
        run: |
          git clone --quiet --depth 1 --branch v2.14.1 --filter=blob:none --sparse https://github.com/NVIDIA-RTX/Streamline.git _Build\streamline-src
          git -C _Build\streamline-src sparse-checkout set include
          New-Item -ItemType Directory -Force _Build\deps\streamline\sdk | Out-Null
          Copy-Item _Build\streamline-src\include _Build\deps\streamline\sdk -Recurse
          Get-ChildItem _Build\deps\streamline\sdk\include -Name

      # AMD's FSR runtime (src/local/frame-gen.cpp: KYTY_FRAMEGEN_BACKEND=fsr, and FSR 4 upscaling for KYTY_UPSCALER=fsr):
      # AMD FSR SDK 2.4's API headers (MIT, LICENSES/FidelityFX-SDK-MIT.txt) at build time, in their layout; its runtime
      # (the DLLs signed by AMD) is the user's own, next to the emulator. Without them the build has no AMD runtime path.
      - name: FSR SDK headers
        shell: pwsh
        continue-on-error: true
        run: |
          git clone --quiet --depth 1 --branch v2.4.0 --filter=blob:none --sparse https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git _Build\fsr-sdk-src
          git -C _Build\fsr-sdk-src sparse-checkout set Kits/FidelityFX/api/include Kits/FidelityFX/framegeneration/include Kits/FidelityFX/upscalers/include
          foreach ($folder in 'api', 'framegeneration', 'upscalers') {
            New-Item -ItemType Directory -Force "_Build\deps\fsr-sdk\Kits\FidelityFX\$folder" | Out-Null
            Copy-Item "_Build\fsr-sdk-src\Kits\FidelityFX\$folder\include" "_Build\deps\fsr-sdk\Kits\FidelityFX\$folder" -Recurse
          }
          Get-ChildItem _Build\deps\fsr-sdk -Recurse -Name -Filter *.h

      # For other PCs: x86-64-v3 (AVX2), not the runner CPU's -march=native.
      - name: Build
        shell: cmd
        env:
          KYTY_CMAKE_ARGS: -DKYTY_MARCH=x86-64-v3
        run: |
          call build-windows.cmd kyty_emulator || exit /b 1
          call build-windows.cmd kyty_shader_precompile || exit /b 1

      # The settings window (launcher-windows: WPF on .NET Framework 4.7.2, part of Windows 10 and 11).
      - name: Build launcher
        shell: cmd
        run: call launcher-windows\build.cmd || exit /b 1

      - name: Package
        shell: pwsh
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          $build = '_Build\windows'
          $out = "_Build\package\$env:PACKAGE"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "$build\kyty_emulator.exe", "$build\kyty_shader_precompile.exe", "$build\libwinpthread-1.dll",
            _Build\launcher\KytyLauncher.exe, run-windows.ps1, precompile-windows.ps1, launcher.ps1, launcher.cmd, LICENSE $out
          Copy-Item LICENSES $out -Recurse
          Copy-Item run-windows.json "$out\launch.json"
          Copy-Item docs\PORTABLE-README.md "$out\README.md"
          # The render-pass states the precompile program makes the seed file with: the first launch lists the
          # game's shaders from its files (kyty_shader_precompile --make-seeds; a release cannot hold that list: it
          # contains the game's shader code). The Python tools that made it before are not needed. With them, each
          # game version's specialization hints: recorded play without the game's code, which the precompile
          # completes with the seed file's (--apply-hints). And the recording of the game's file opens a first launch
          # starts from (files-*.files: file names, opened ahead of the game's loads).
          $states = "$out\tools\local\static-precompile"
          New-Item -ItemType Directory -Force $states | Out-Null
          Copy-Item tools\local\static-precompile\pass-states.json, tools\local\static-precompile\hints-*.hints $states
          Copy-Item tools\local\static-precompile\files-*.files $states -ErrorAction SilentlyContinue
          # The VC++ runtime next to the exe (Microsoft's redistributable files): nothing to install.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-Item "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" | Where-Object { $_.Parent.Parent.Name -match '^\d+\.' } |
            Sort-Object { [version]$_.Parent.Parent.Name } | Select-Object -Last 1
          Copy-Item "$($crt.FullName)\msvcp140*.dll", "$($crt.FullName)\vcruntime140*.dll" $out
          # Double-click to play or to precompile (PowerShell's script policy would stop the scripts themselves).
          Set-Content "$out\run.cmd" -Encoding ASCII -Value @(
            '@echo off',
            'rem Starts the game; the options are those of run-windows.ps1 (e.g. run.cmd -Fullscreen).',
            '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "%~dp0run-windows.ps1" -Prompt -Follow %*',
            'if %errorlevel% neq 0 pause')
          Set-Content "$out\precompile.cmd" -Encoding ASCII -Value @(
            '@echo off',
            'rem Every shader and pipeline of the game into the static pipeline cache: hours on a few cores (run it',
            'rem overnight, it resumes when interrupted). Options: those of precompile-windows.ps1.',
            '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "%~dp0precompile-windows.ps1" %*',
            'pause')
          $root = (Resolve-Path $out).Path
          Get-ChildItem $out -Recurse -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring($root.Length + 1) }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.package }}
          path: _Build/package/
          if-no-files-found: error

  release:
    name: Publish release
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE: ${{ needs.windows.outputs.package }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.package }}
          path: package

      - name: Release notes
        uses: actions/checkout@v4
        with:
          path: notes
          sparse-checkout: docs/RELEASE-NOTES.md
          sparse-checkout-cone-mode: false

      - name: Publish
        shell: bash
        run: |
          (cd package && zip -qr "../$PACKAGE.zip" "$PACKAGE")
          # A tag's own release, else a new tag named after the package at this commit.
          tag="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="$PACKAGE"
          notes="Windows x64 build of ${GITHUB_SHA::8} for Demon's Souls (PPSA01341, versions 01.007.000 and 01.005.000). Unzip it and double-click KytyLauncher.exe (or run.cmd); the README.md inside explains the rest."
          # A tag's release holds both packages, and either job may make it (the other uploads to it): the same title
          # and header whichever does (build.yml, build-linux.yml). v20261024's Linux job came first and titled it as
          # the Linux package's.
          title="$PACKAGE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            title="KytyPS5-$tag"
            notes="$(printf '%s\n\n%s\n\n%s' \
              "Windows x64 build of ${GITHUB_SHA::8} for Demon's Souls (PPSA01341, versions 01.007.000 and 01.005.000): KytyPS5-$tag.zip. Unzip it and double-click KytyLauncher.exe (or run.cmd); the README.md inside explains the rest." \
              "Linux x64 build: KytyPS5-linux-$tag.zip. Unzip it and run ./kyty_launcher (the settings window), or ./run_ds.sh with KYTY_GAME set to the game; the README.md inside explains the rest." \
              "Steam Deck build: KytyPS5-steamdeck-$tag.zip. Unzip it into ~/KytyPS5 and add run-deck.sh to Steam as a non-Steam game; STEAM-DECK.md inside explains the rest.")"
          fi
          # The notes of this build (what changed, the per-PC shader caches, frame rates), when the commit has them.
          if [ -s notes/docs/RELEASE-NOTES.md ]; then notes="$(printf '%s\n\n%s' "$notes" "$(cat notes/docs/RELEASE-NOTES.md)")"; fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$PACKAGE.zip" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$PACKAGE.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes" --latest
          fi
