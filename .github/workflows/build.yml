name: Build KytyPS5 (Windows)

# This fork's Windows build (Demon's Souls, see README.md): a manual run (Actions > Build KytyPS5 (Windows) >
# Run workflow) or a pushed v* tag builds the release package and publishes it as a GitHub release, marked
# latest (README.md links to the latest one). Pushes build nothing.
on:
  push:
    tags: [ 'v*' ]
    # This fork: every push to the shaders branch builds it.
    branches: [ shaders ]
  workflow_dispatch:
    inputs:
      pgo_generate:
        description: 'Instrumented build for a PGO training run (the live command `pgo <file>` writes the profile)'
        type: boolean
        default: false
      ffx_mfg:
        description: 'FSR 3 frame generation x3: build amd_fidelityfx_vk.dll from the patched SDK (always on the fg/x3 branch)'
        type: boolean
        default: false
      publish:
        description: 'Publish the release (not a draft) and mark it as the latest'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build (Windows x64)
    runs-on: windows-2022
    outputs:
      package: ${{ steps.name.outputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Package name
        id: name
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "KytyPS5-$env:GITHUB_REF_NAME" } else {
            "KytyPS5-$((Get-Date).ToUniversalTime().ToString('yyyyMMdd'))-$($env:GITHUB_SHA.Substring(0, 8))" }
          if ('${{ inputs.pgo_generate }}' -eq 'true') { $name = "$name-pgogen" }
          if ($env:GITHUB_REF_NAME -eq 'fsr3-prueba') { $name = "$name-fsr3" }
          if ($env:GITHUB_REF_NAME -in @('dlss-prueba','dlssg-decouple','dlss-release','lowmem-16gb','merge-1016','upscale','merge-1019')) { $name = "$name-dlss" }
          if ($env:GITHUB_REF_NAME -eq 'fg/x3') { $name = "$name-fgx3" }
          "package=$name" >> $env:GITHUB_OUTPUT

      # The tested compiler (LLVM 23.1.2 crashed compiling agc.cpp; others are untested).
      - name: Install LLVM 19.1.7
        shell: pwsh
        run: choco upgrade llvm --version=19.1.7 --allow-downgrade --no-progress -y

      # glslangValidator: the runner has no Vulkan SDK.
      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $root = Split-Path (Get-Command vcpkg).Source
          $hash = (Get-FileHash "$root\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          "root=$root" >> $env:GITHUB_OUTPUT
          "port_hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache glslang
        id: glslang
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          if ('${{ steps.glslang.outputs.cache-hit }}' -ne 'true') { vcpkg install 'glslang[tools,opt]:x64-windows' }
          "${{ steps.vcpkg.outputs.root }}\installed\x64-windows\tools\glslang" >> $env:GITHUB_PATH

      # PGO training runs (tools/pgo/raw/*.profraw, written by an instrumented build of this source with the live
      # command `pgo <file>` while playing) merged into the release profile, weighted over the older one: the
      # functions changed since it was trained get their profile back. The merged profile goes into the package
      # (kyty.profdata) to be committed as tools/pgo/kyty.profdata.
      - name: PGO profile
        if: ${{ inputs.pgo_generate != true }}
        shell: pwsh
        run: |
          $raw = @(Get-ChildItem tools\pgo\raw\*.profraw -ErrorAction SilentlyContinue)
          if ($raw.Count -eq 0) { 'no training runs: tools\pgo\kyty.profdata as it is'; exit 0 }
          $profdata = 'C:\Program Files\LLVM\bin\llvm-profdata.exe'
          $inputs = @('--weighted-input=1,tools\pgo\kyty.profdata') + ($raw | ForEach-Object { "--weighted-input=4,$($_.FullName)" })
          & $profdata merge -o tools\pgo\kyty-merged.profdata @inputs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $profdata show tools\pgo\kyty-merged.profdata | Select-Object -First 6
          Move-Item -Force tools\pgo\kyty-merged.profdata tools\pgo\kyty.profdata

      # AMD FidelityFX API, FSR 3.1.4 frame generation (src/local/fsr3-fg.cpp, KYTY_FSR3_FG): AMD's prebuilt,
      # signed amd_fidelityfx_vk.dll (MIT license) from the SDK's v1.1.4 tag, packaged next to the emulator.
      - name: FidelityFX DLL
        if: ${{ inputs.ffx_mfg != true && github.ref_name != 'fg/x3' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _Build\deps\ffx | Out-Null
          $base = 'https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/v1.1.4'
          Invoke-WebRequest "$base/PrebuiltSignedDLL/amd_fidelityfx_vk.dll" -OutFile _Build\deps\ffx\amd_fidelityfx_vk.dll
          Invoke-WebRequest "$base/LICENSE.txt" -OutFile _Build\deps\ffx\FidelityFX-LICENSE.txt
          Get-ChildItem _Build\deps\ffx | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.Name }

      # FSR 3 frame generation x3 (KYTY_FSR3_FG_FRAMES=2): the same SDK tag built from source with
      # tools/local/fsr3-mfg/ffx-sdk-v1.1.4-mfg.patch (interpolation factor t in the frame interpolation shaders, N
      # generated frames per real frame in the Vulkan frame generation swapchain). Unsigned; replaces AMD's DLL.
      # Needs the Vulkan SDK (headers + vulkan-1.lib, >= 1.3.250); shaders use the SDK's own FidelityFX_SC/glslang.
      - name: FidelityFX DLL (patched, multi frame generation)
        if: ${{ inputs.ffx_mfg == true || github.ref_name == 'fg/x3' }}
        shell: pwsh
        env:
          VULKAN_VERSION: 1.3.296.0
        run: |
          $vk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/VulkanSDK-$env:VULKAN_VERSION-Installer.exe" -OutFile "$env:RUNNER_TEMP\vksdk.exe"
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\vksdk.exe" -ArgumentList '--root', $vk, '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          if (!(Test-Path "$vk\Lib\vulkan-1.lib")) { Get-ChildItem $vk -ErrorAction SilentlyContinue; throw 'Vulkan SDK install failed' }
          $env:VULKAN_SDK = $vk
          $src = "$env:RUNNER_TEMP\ffx"
          git -c core.autocrlf=false clone --depth 1 --branch v1.1.4 https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK $src
          if ($LASTEXITCODE) { throw 'SDK clone failed' }
          git -C $src apply --verbose "$env:GITHUB_WORKSPACE\tools\local\fsr3-mfg\ffx-sdk-v1.1.4-mfg.patch"
          if ($LASTEXITCODE) { throw 'SDK patch failed' }
          cmake -S "$src\ffx-api" -B "$src\ffx-api\build" -G 'Visual Studio 17 2022' -A x64 -DFFX_API_BACKEND=VK_X64 "-DVulkan_INCLUDE_DIR=$vk\Include" "-DVulkan_LIBRARY=$vk\Lib\vulkan-1.lib"
          if ($LASTEXITCODE) { throw 'SDK configure failed' }
          cmake --build "$src\ffx-api\build" --config Release --target amd_fidelityfx_vk --parallel 4 -- /p:CL_MPcount=4 /v:minimal
          if ($LASTEXITCODE) { throw 'SDK build failed' }
          New-Item -ItemType Directory -Force _Build\deps\ffx | Out-Null
          $dll = Get-ChildItem "$src\ffx-api" -Recurse -Filter amd_fidelityfx_vk.dll | Where-Object FullName -notmatch 'PrebuiltSignedDLL' | Select-Object -First 1
          if (!$dll) { throw 'amd_fidelityfx_vk.dll not built' }
          Copy-Item $dll.FullName _Build\deps\ffx\amd_fidelityfx_vk.dll
          Copy-Item "$src\LICENSE.txt" _Build\deps\ffx\FidelityFX-LICENSE.txt
          Get-ChildItem _Build\deps\ffx | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.Name }

      # NVIDIA Streamline SDK (DLSS Frame Generation, src/local/frame-gen.cpp; the dlss-prueba branch only): downloaded at
      # build time from NVIDIA's public release, never committed. CMakeLists.txt enables KYTY_FRAMEGEN_STREAMLINE when
      # _Build/deps/streamline/sdk/include/sl.h exists. Its packages are draft releases (they hold NVIDIA's DLLs).
      - name: Streamline SDK
        if: ${{ github.ref_name == 'dlss-prueba' || github.ref_name == 'dlssg-decouple' || github.ref_name == 'dlss-release' || github.ref_name == 'lowmem-16gb' || github.ref_name == 'merge-1016' || github.ref_name == 'upscale' || github.ref_name == 'merge-1019' || github.ref_name == 'release-1023' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STREAMLINE_VERSION: v2.14.16
          DLSS_VERSION: v310.9.16
        run: |
          $zips = '_Build\deps\streamline-zip'
          $unpacked = '_Build\deps\streamline-unpacked'
          New-Item -ItemType Directory -Force $zips, $unpacked | Out-Null
          gh release download $env:STREAMLINE_VERSION --repo NVIDIA-RTX/Streamline --pattern '*.zip' --dir $zips
          if ($LASTEXITCODE -or !(Get-ChildItem $zips -Filter *.zip)) {
            Write-Host 'no release zip; cloning the tag'
            git lfs install
            git clone --depth 1 --branch $env:STREAMLINE_VERSION https://github.com/NVIDIA-RTX/Streamline "$unpacked\repo"
            if ($LASTEXITCODE) { throw 'Streamline clone failed' }
            git -C "$unpacked\repo" lfs pull
            $global:LASTEXITCODE = 0
          }
          Get-ChildItem $zips -Filter *.zip | ForEach-Object { Write-Host "unpacking $($_.Name)"; Expand-Archive $_.FullName (Join-Path $unpacked $_.BaseName) -Force }
          $header = Get-ChildItem $unpacked -Recurse -Filter sl.h | Where-Object { $_.Directory.Name -eq 'include' } |
            Where-Object { Test-Path (Join-Path $_.Directory.Parent.FullName 'bin\x64\sl.interposer.dll') } | Select-Object -First 1
          if (!$header) { Get-ChildItem $unpacked -Recurse -Depth 3 | ForEach-Object FullName; throw 'no include\sl.h with bin\x64\sl.interposer.dll' }
          New-Item -ItemType Directory -Force _Build\deps\streamline | Out-Null
          Move-Item $header.Directory.Parent.FullName _Build\deps\streamline\sdk
          Get-ChildItem _Build\deps\streamline\sdk\bin\x64 -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.Name }
          # DLSS-G Preset C (KYTY_DLSSG_PRESET=C) needs nvngx_dlssg.dll >= 310.9.16: when Streamline's is older, take
          # NVIDIA's from the official DLSS SDK release (github.com/NVIDIA/DLSS, redistributable like Streamline's).
          $dlssg = '_Build\deps\streamline\sdk\bin\x64\nvngx_dlssg.dll'
          $have = if (Test-Path $dlssg) { [version](Get-Item $dlssg).VersionInfo.FileVersion.Replace(',', '.').Split(' ')[0] } else { [version]'0.0' }
          Write-Host "Streamline's nvngx_dlssg.dll: $have"
          if ($have -lt [version]'310.9.16') {
            git clone --depth 1 --branch $env:DLSS_VERSION --filter=blob:none --sparse https://github.com/NVIDIA/DLSS _Build\deps\dlss
            if ($LASTEXITCODE) { throw 'DLSS SDK clone failed' }
            git -C _Build\deps\dlss sparse-checkout set --no-cone /lib/Windows_x86_64/rel/nvngx_dlssg.dll /LICENSE.txt
            $new = '_Build\deps\dlss\lib\Windows_x86_64\rel\nvngx_dlssg.dll'
            if (!(Test-Path $new)) { throw 'no nvngx_dlssg.dll in the DLSS SDK' }
            Copy-Item $new $dlssg -Force
            Write-Host "nvngx_dlssg.dll from DLSS ${env:DLSS_VERSION}: $((Get-Item $dlssg).VersionInfo.FileVersion)"
          }

      # Intel XeSS SDK (super resolution, src/local/xess-sr.cpp; the upscale branch): its headers and libxess.dll
      # (Intel's redistributable binary) from Intel's public repository, never committed.
      - name: XeSS SDK
        if: ${{ github.ref_name == 'upscale' || github.ref_name == 'merge-1019' || github.ref_name == 'release-1023' }}
        shell: pwsh
        env:
          XESS_VERSION: v3.0.2
        run: |
          git clone --depth 1 --branch $env:XESS_VERSION https://github.com/intel/xess _Build\deps\xess
          if ($LASTEXITCODE) { throw 'XeSS clone failed' }
          if (!(Test-Path _Build\deps\xess\inc\xess\xess_vk.h) -or !(Test-Path _Build\deps\xess\bin\libxess.dll)) { throw 'no xess_vk.h or libxess.dll' }
          Get-Item _Build\deps\xess\bin\libxess.dll | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.Name }

      # For other PCs: x86-64-v3 (AVX2), not the runner CPU's -march=native.
      - name: Build
        shell: cmd
        env:
          KYTY_CMAKE_ARGS: -DKYTY_MARCH=x86-64-v3 ${{ inputs.pgo_generate == true && '-DKYTY_PGO_GENERATE=ON' || '' }}
        run: |
          call build-windows.cmd kyty_emulator > build.log 2>&1 || (type build.log & exit /b 1)
          call build-windows.cmd kyty_shader_precompile >> build.log 2>&1 || (type build.log & exit /b 1)
          type build.log

      - name: Build errors
        if: failure()
        shell: pwsh
        run: |
          # The compiler's errors as annotations (readable through the API when the log is not).
          if (Test-Path build.log) {
            Select-String -Path build.log -Pattern 'error' | Select-Object -First 10 | ForEach-Object {
              $line = $_.Line -replace '[\r\n]', ' '
              Write-Output "::error::$line"
            }
          }

      - name: Package
        shell: pwsh
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          $build = '_Build\windows'
          $out = "_Build\package\$env:PACKAGE"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "$build\kyty_emulator.exe", "$build\kyty_shader_precompile.exe", "$build\libwinpthread-1.dll",
            run-windows.ps1, precompile-windows.ps1, launcher.ps1, launcher.cmd, LICENSE $out
          Copy-Item LICENSES $out -Recurse
          # Demon's Souls launcher (window with frame generation choice) and its two configs.
          Copy-Item Launcher-souls.ps1, Launcher-souls-EN.ps1, Launcher-souls.cmd, 'Jugar (Espanol).cmd', 'Play (English).cmd', fondo-souls.jpg, LEEME-souls.txt, metricas.ps1, NOVEDADES.txt $out
          Copy-Item config "$out\config" -Recurse
          Copy-Item run-windows.json "$out\launch.json"
          Copy-Item docs\PORTABLE-README.md "$out\README.md"
          # The linker map of this exact build: render-thread profiles (live `prof`) are symbolized against it.
          Get-ChildItem "$build\kyty_emulator_*.map" -ErrorAction SilentlyContinue | Select-Object -First 1 |
            ForEach-Object { Copy-Item $_.FullName "$out\kyty_emulator.map" }
          # DLSS Frame Generation (KYTY_FRAMEGEN): Streamline's production DLLs (bin\x64), dlss-prueba builds only.
          # XeSS super resolution: libxess.dll next to the emulator, with Intel's license.
          if (Test-Path _Build\deps\xess\bin\libxess.dll) {
            Copy-Item _Build\deps\xess\bin\libxess.dll $out
            New-Item -ItemType Directory -Force "$out\LICENSES" | Out-Null
            Copy-Item _Build\deps\xess\LICENSE.txt "$out\LICENSES\XeSS-LICENSE.txt"
          }
          if (Test-Path _Build\deps\streamline\sdk\bin\x64) {
            New-Item -ItemType Directory -Force "$out\streamline" | Out-Null
            Copy-Item _Build\deps\streamline\sdk\bin\x64\*.dll "$out\streamline"
            Get-ChildItem _Build\deps\streamline\sdk -File | Where-Object Name -match 'license' | Copy-Item -Destination "$out\streamline"
          }
          # FSR 3 frame generation (KYTY_FSR3_FG): AMD's FidelityFX API DLL and its license.
          Copy-Item _Build\deps\ffx\amd_fidelityfx_vk.dll, _Build\deps\ffx\FidelityFX-LICENSE.txt $out
          # The profile this build was optimized with (merged with the training runs, see "PGO profile").
          if (Test-Path tools\pgo\kyty.profdata) { Copy-Item tools\pgo\kyty.profdata "$out\kyty.profdata" }
          # The render-pass states the precompile program makes the seed file with: the first launch lists the
          # game's shaders from its files (kyty_shader_precompile --make-seeds; a release cannot hold that list: it
          # contains the game's shader code). The Python tools that made it before are not needed. With them, each
          # game version's specialization hints: recorded play without the game's code, which the precompile
          # completes with the seed file's (--apply-hints). And the recording of the game's file opens a first launch
          # starts from (files-*.files: file names, opened ahead of the game's loads).
          $states = "$out\tools\local\static-precompile"
          New-Item -ItemType Directory -Force $states | Out-Null
          Copy-Item tools\local\static-precompile\pass-states.json, tools\local\static-precompile\hints-*.hints $states
          Copy-Item tools\local\static-precompile\files-*.files $states -ErrorAction SilentlyContinue
          # The VC++ runtime next to the exe (Microsoft's redistributable files): nothing to install.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-Item "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" | Where-Object { $_.Parent.Parent.Name -match '^\d+\.' } |
            Sort-Object { [version]$_.Parent.Parent.Name } | Select-Object -Last 1
          Copy-Item "$($crt.FullName)\msvcp140*.dll", "$($crt.FullName)\vcruntime140*.dll" $out
          # Double-click to play or to precompile (PowerShell's script policy would stop the scripts themselves).
          Set-Content "$out\run.cmd" -Encoding ASCII -Value @(
            '@echo off',
            'rem Starts the game; the options are those of run-windows.ps1 (e.g. run.cmd -Fullscreen).',
            '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "%~dp0run-windows.ps1" -Prompt -Follow %*',
            'if %errorlevel% neq 0 pause')
          Set-Content "$out\precompile.cmd" -Encoding ASCII -Value @(
            '@echo off',
            'rem Every shader and pipeline of the game into the static pipeline cache: hours on a few cores (run it',
            'rem overnight, it resumes when interrupted). Options: those of precompile-windows.ps1.',
            '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "%~dp0precompile-windows.ps1" %*',
            'pause')
          $root = (Resolve-Path $out).Path
          Get-ChildItem $out -Recurse -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring($root.Length + 1) }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.package }}
          path: _Build/package/
          if-no-files-found: error

  release:
    name: Publish release
    needs: windows
    # Local test branches: the package stays an Actions artifact, nothing is published.
    if: ${{ github.ref_name != 'dlssg-decouple' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE: ${{ needs.windows.outputs.package }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.package }}
          path: package

      - name: Release notes
        uses: actions/checkout@v4
        with:
          path: notes
          sparse-checkout: docs/RELEASE-NOTES.md
          sparse-checkout-cone-mode: false

      - name: Publish
        shell: bash
        run: |
          (cd package && zip -qr "../$PACKAGE.zip" "$PACKAGE")
          # A tag's own release, else a new tag named after the package at this commit.
          tag="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="$PACKAGE"
          notes="Windows x64 build of ${GITHUB_SHA::8} (todojuegos67-bot fork, on top of chenxiao07/KytyPS5) for Demon's Souls (PPSA01341, versions 01.007.000 and 01.005.000). Unzip it and double-click run.cmd or launcher.cmd; the README.md inside explains the rest."
          # The notes of this build (what changed, the per-PC shader caches, frame rates), when the commit has them.
          if [ -s notes/docs/RELEASE-NOTES.md ]; then notes="$(printf '%s\n\n%s' "$notes" "$(cat notes/docs/RELEASE-NOTES.md)")"; fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$PACKAGE.zip" --clobber --repo "$GITHUB_REPOSITORY"
          else
            draft=""; [[ "$PACKAGE" == *-dlss ]] && draft="--draft"
            latest=$([[ "$PACKAGE" == *-pgogen || "$PACKAGE" == *-fsr3 || "$PACKAGE" == *-dlss || "$PACKAGE" == *-fgx3 ]] && echo --latest=false || echo --latest)
            if [ "${{ inputs.publish }}" = "true" ]; then draft=""; latest="--latest"; [ -s "package/$PACKAGE/NOVEDADES.txt" ] && notes="$(cat "package/$PACKAGE/NOVEDADES.txt")"; fi
            gh release create "$tag" "$PACKAGE.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $draft \
              --title "$PACKAGE" --notes "$notes" $latest
          fi
