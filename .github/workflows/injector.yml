name: Build injector (Windows)

# The generic frame injector (branches injector-*): builds vulkan-1.dll (our proxy), InjectorSetup.exe, packages them
# with DXVK's official x64 d3d11.dll / dxgi.dll and AMD's signed amd_fidelityfx_vk.dll (FidelityFX SDK v1.1.4), and
# makes a DRAFT release (never published by this workflow). The asset id and md5s go out as annotations.
# Phase 2 (upscalers) adds, all from their vendors' public releases at fixed tags, never committed: NVIDIA Streamline
# v2.14.16 (DLSS: its production sl.interposer / sl.common / sl.dlss / nvngx_dlss DLLs), Intel XeSS SDK v3.0.2
# (libxess.dll) and nlohmann/json v3.11.3 (FSR 4's manifest reader). FSR 4's model (fsr4_shaders/, AMD, MIT) is in the
# branch, checked against its manifests by tools/fsr4_check.py.
on:
  push:
    branches: [ 'injector-*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (fixed tags, official sources only)
        shell: pwsh
        run: |
          git clone -q --depth 1 -b v1.3.290 https://github.com/KhronosGroup/Vulkan-Headers third_party/Vulkan-Headers
          git clone -q --depth 1 -b v1.91.0 https://github.com/ocornut/imgui third_party/imgui
          New-Item -ItemType Directory -Force deps | Out-Null
          $ffx = 'https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/v1.1.4'
          Invoke-WebRequest "$ffx/PrebuiltSignedDLL/amd_fidelityfx_vk.dll" -OutFile deps/amd_fidelityfx_vk.dll
          Invoke-WebRequest "$ffx/LICENSE.txt" -OutFile deps/FidelityFX-LICENSE.txt
          Invoke-WebRequest 'https://github.com/doitsujin/dxvk/releases/download/v2.6.1/dxvk-2.6.1.tar.gz' -OutFile deps/dxvk.tar.gz
          tar -xzf deps/dxvk.tar.gz -C deps
          # nlohmann/json (single header) for FSR 4's manifests.
          New-Item -ItemType Directory -Force third_party/json/nlohmann | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/nlohmann/json/v3.11.3/single_include/nlohmann/json.hpp' -OutFile third_party/json/nlohmann/json.hpp
          # Intel XeSS SDK (headers + libxess.dll, Intel's redistributable).
          git clone -q --depth 1 -b v3.0.2 https://github.com/intel/xess third_party/xess
          if (!(Test-Path third_party/xess/inc/xess/xess_vk.h) -or !(Test-Path third_party/xess/bin/libxess.dll)) { throw 'XeSS SDK: no xess_vk.h or libxess.dll' }
          Get-ChildItem deps -Recurse -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName }

      - name: Streamline SDK (NVIDIA's public release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zips = 'deps/sl-zip'; $unpacked = 'deps/sl'
          New-Item -ItemType Directory -Force $zips, $unpacked | Out-Null
          gh release download v2.14.16 --repo NVIDIA-RTX/Streamline --pattern '*.zip' --dir $zips
          if ($LASTEXITCODE -or !(Get-ChildItem $zips -Filter *.zip)) {
            Write-Host 'no release zip; cloning the tag'
            git lfs install
            git clone --depth 1 --branch v2.14.16 https://github.com/NVIDIA-RTX/Streamline "$unpacked/repo"
            if ($LASTEXITCODE) { throw 'Streamline clone failed' }
            git -C "$unpacked/repo" lfs pull
            $global:LASTEXITCODE = 0
          }
          Get-ChildItem $zips -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName (Join-Path $unpacked $_.BaseName) -Force }
          $header = Get-ChildItem $unpacked -Recurse -Filter sl.h | Where-Object { $_.Directory.Name -eq 'include' } |
            Where-Object { Test-Path (Join-Path $_.Directory.Parent.FullName 'bin\x64\sl.interposer.dll') } | Select-Object -First 1
          if (!$header) { throw 'Streamline: no include\sl.h next to bin\x64\sl.interposer.dll' }
          Move-Item $header.Directory.Parent.FullName third_party/streamline
          Get-ChildItem third_party/streamline/bin/x64 -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.Name }

      - name: FSR 4 assets check
        shell: pwsh
        run: |
          python tools/fsr4_check.py fsr4_shaders
          if ($LASTEXITCODE -ne 0) { throw 'fsr4_shaders: the assets do not match their manifests' }

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DINJ_REQUIRE_UPSCALERS=ON
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ' error ' | Select-Object -First 15 | ForEach-Object { "::error::$($_.Line -replace '[\r\n]', ' ')" }
            exit 1
          }

      - name: Exports check
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" >nul
          dumpbin /exports build\Release\vulkan-1.dll | findstr vk

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $name = "Injector-$((Get-Date).ToUniversalTime().ToString('yyyyMMdd'))-$($env:GITHUB_SHA.Substring(0, 8))"
          $root = "out/$name"
          New-Item -ItemType Directory -Force "$root/payload", "$root/licenses" | Out-Null
          Copy-Item build/Release/InjectorSetup.exe $root/
          Copy-Item build/Release/vulkan-1.dll "$root/payload/"
          Copy-Item deps/dxvk-2.6.1/x64/d3d11.dll, deps/dxvk-2.6.1/x64/dxgi.dll "$root/payload/"
          Copy-Item deps/amd_fidelityfx_vk.dll "$root/payload/"
          Copy-Item payload/dxvk.conf, payload/injector.ini "$root/payload/"
          # Phase 2: XeSS, DLSS (Streamline's production DLLs only) and FSR 4's model.
          Copy-Item third_party/xess/bin/libxess.dll "$root/payload/"
          New-Item -ItemType Directory -Force "$root/payload/streamline", "$root/payload/fsr4_shaders" | Out-Null
          foreach ($dll in 'sl.interposer.dll', 'sl.common.dll', 'sl.dlss.dll', 'nvngx_dlss.dll') {
            $src = "third_party/streamline/bin/x64/$dll"
            if (!(Test-Path $src)) { throw "Streamline: no $dll in bin/x64" }
            Copy-Item $src "$root/payload/streamline/"
          }
          Copy-Item fsr4_shaders/* "$root/payload/fsr4_shaders/"
          Copy-Item third_party/xess/LICENSE.txt "$root/licenses/XeSS-LICENSE.txt"
          Get-ChildItem third_party/streamline -File | Where-Object Name -match 'license' | ForEach-Object { Copy-Item $_.FullName "$root/licenses/Streamline-$($_.Name)" }
          Copy-Item fsr4_shaders/LICENSE-FSR4-v07.txt "$root/licenses/FSR4-v07-LICENSE.txt"
          Copy-Item third_party/Vulkan-Headers/LICENSE.md "$root/licenses/Vulkan-Headers-LICENSE.md" -ErrorAction SilentlyContinue
          Copy-Item deps/FidelityFX-LICENSE.txt "$root/licenses/"
          Copy-Item deps/dxvk-2.6.1/LICENSE -Destination "$root/licenses/DXVK-LICENSE.txt" -ErrorAction SilentlyContinue
          Copy-Item third_party/imgui/LICENSE.txt "$root/licenses/imgui-LICENSE.txt"
          Copy-Item README.md "$root/README.md"
          $lines = Get-ChildItem $root -Recurse -File | ForEach-Object {
            $md5 = (Get-FileHash $_.FullName -Algorithm MD5).Hash.ToLowerInvariant()
            "$md5  $($_.FullName.Substring((Resolve-Path $root).Path.Length + 1))" }
          $lines | Set-Content "$root/MD5SUMS.txt"
          $lines
          Compress-Archive -Path $root -DestinationPath "out/$name.zip"
          $zipmd5 = (Get-FileHash "out/$name.zip" -Algorithm MD5).Hash.ToLowerInvariant()
          "zip md5 $zipmd5"
          "name=$name" >> $env:GITHUB_OUTPUT
          "zipmd5=$zipmd5" >> $env:GITHUB_OUTPUT
          foreach ($l in $lines) { "::notice title=md5::$l" }

      - name: Draft release (never published)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = '${{ steps.pkg.outputs.name }}'
          $tag = "injector-$($env:GITHUB_SHA.Substring(0, 8))-r$($env:GITHUB_RUN_NUMBER)"
          gh release create $tag "out/$name.zip" --draft --target $env:GITHUB_SHA --title "$name (draft, untested)" `
            --notes "Generic DX11 (DXVK) injector, phase 2: frame generation + upscalers (DLSS via Streamline, FSR 4, FSR 3.1, XeSS). DRAFT: not published, untested in a game. See README.md in the zip. zip md5 ${{ steps.pkg.outputs.zipmd5 }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $rels = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=30" | ConvertFrom-Json
          $rel = $rels | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          foreach ($a in $rel.assets) {
            $line = "release $($rel.id) draft=$($rel.draft) asset id $($a.id) $($a.name) $($a.size) bytes, zip md5 ${{ steps.pkg.outputs.zipmd5 }}"
            $line
            "::notice title=asset::$line"
          }
          exit 0
